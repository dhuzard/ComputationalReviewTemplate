name: Deploy MyST site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned MyST CLI
        run: npm install --global mystmd@1.10.1

      - name: Confirm committed figure renders
        run: |
          echo "Figure notebooks are reproducibility artifacts and are not executed during deployment."
          find figures -maxdepth 1 -type f -name '*.png' -print

      - name: Build MyST site
        env:
          BASE_URL: /ComputationalReviewTemplate
        run: myst build --html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
