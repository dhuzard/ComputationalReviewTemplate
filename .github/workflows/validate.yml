name: Validate template

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned MyST CLI
        run: npm install --global mystmd@1.10.1

      - name: Run Node and rendered golden tests
        run: node --test test/*.test.mjs

      - name: Build a clean template clone
        run: myst build --html
